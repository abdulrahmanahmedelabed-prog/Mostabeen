<style id="app-style">
/* Layout: a working bench. One header, a tab rail, then a single reading column of result sheets. */
:root{
  --bg:#f1f5f4; --surface:#fcfdfc; --ink:#10282b; --ink2:#465d5c; --muted:#75878a; --line:#d5dedc;

  --s1:#2a78d6; --neg3:#c43c3c; --neg2:#e27f7f; --neg1:#f2b8b8; --mid:#dcdcd6; --pos1:#b7d3f6; --pos2:#6da7ec; --pos3:#256abf;
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --crit:#d03b3b;
  --display:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1415; --surface:#121e1f; --ink:#e8efee; --ink2:#b3c3c1; --muted:#80928f; --line:#263637;
  --accent:#43b8b0; --accent-ink:#04201f; --accent-soft:#16302f; --mark:#6b5514;
  --s1:#3987e5; --mid:#4a4a46; --good-ink:#35c435; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0b1415; --surface:#121e1f; --ink:#e8efee; --ink2:#b3c3c1; --muted:#80928f; --line:#263637;
  --accent:#43b8b0; --accent-ink:#04201f; --accent-soft:#16302f; --mark:#6b5514;
  --s1:#3987e5; --mid:#4a4a46; --good-ink:#35c435; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7}
.wrap{max-width:1080px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.35}
h1{font-size:1.35rem} h2{font-size:1.15rem} h3{font-size:.98rem;font-weight:500}
p{margin:0} .num,td.n,th.n{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)} .small{font-size:.85rem}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand b{font-family:var(--display);font-size:1.5rem;color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:6px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--accent)}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
.banner{background:var(--mark);color:#10282b;padding:8px 14px;border-radius:6px;font-size:.9rem}
:root[data-theme="dark"] .banner{color:#f5ecd0}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .banner{color:#f5ecd0} }
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{border:0;background:none;border-radius:0;padding:10px 14px;color:var(--ink2);white-space:nowrap;border-bottom:3px solid transparent}
nav.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
section.panel{display:flex;flex-direction:column;gap:18px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sheet>header{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:2px}
.tile .k{font-size:.82rem;color:var(--ink2)} .tile .v{font-family:var(--mono);font-size:1.7rem;line-height:1.3;direction:ltr;text-align:right}
.tile .s{font-size:.8rem;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{font-weight:600;color:var(--ink2);font-size:.82rem;white-space:nowrap}
td.n,th.n{text-align:left}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:99px;font-size:.8rem;border:1px solid var(--line);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok::before{background:var(--good)} .pill.warn::before{background:var(--warn)} .pill.bad::before{background:var(--crit)}

.bars{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:minmax(90px,220px) 1fr 92px;gap:10px;align-items:center}
.blab{font-size:.88rem;min-width:0;overflow-wrap:anywhere}
.btrack{height:14px;display:flex}
.bfill{background:var(--s1);height:100%;border-start-end-radius:4px;border-end-end-radius:4px;min-width:2px}
.bval{font-family:var(--mono);font-size:.82rem;direction:ltr;text-align:left;color:var(--ink2)}
.lhead,.lrow{display:grid;grid-template-columns:minmax(120px,300px) 1fr 54px 62px;gap:10px;align-items:center}
.lhead{font-size:.78rem;color:var(--muted)}
.lstack{display:flex;gap:2px;height:22px;min-width:0}
.seg{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.72rem;overflow:hidden;min-width:2px;color:#0b0b0b}
.seg.w{color:#fff} .seg.m{color:var(--ink)}
.lnum{font-family:var(--mono);font-size:.85rem;direction:ltr;text-align:left}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--ink2)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}
.hist{display:flex;align-items:flex-end;gap:2px;height:110px;direction:ltr;border-bottom:1px solid var(--line)}
.hist div{flex:1;background:var(--s1);border-radius:4px 4px 0 0;min-height:1px}
.haxis{display:flex;justify-content:space-between;direction:ltr;font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.heat td,.heat th{text-align:center;padding:5px;font-size:.78rem;border:2px solid var(--surface)}
.heat th{white-space:normal;max-width:130px;font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px}
.stat{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;background:var(--accent-soft);padding:2px 8px;border-radius:4px;display:inline-block}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
ul.clean{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.check{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.check small{grid-column:2;color:var(--muted)}
.meter{height:10px;background:var(--line);border-radius:5px;overflow:hidden;display:flex}
.meter div{background:var(--accent)}
.drop{border:2px dashed var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:10px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:4px 9px;border-radius:5px;font-size:.8rem;max-width:260px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:0;margin-inline:auto;width:fit-content;max-width:90%;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;z-index:60}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:clamp(18px,4vw,44px);display:flex;flex-direction:column;gap:20px}
.paper h1{font-size:1.6rem} .paper h2{border-bottom:2px solid var(--accent);padding-bottom:4px}
.paper section{display:flex;flex-direction:column;gap:10px}
.paper p,.paper li{max-width:70ch}
@media (max-width:620px){
  .scroll>table:has(thead){min-width:640px}

  .lhead{display:none} .lrow{grid-template-columns:1fr 50px 58px} .lrow .blab{grid-column:1/-1}
}
@media print{ nav.tabs,header.top,.noprint,.banner{display:none!important} body{background:#fff} .paper{border:0;padding:0} section.panel[hidden]{display:none!important} }

<script>
document.documentElement.dir='rtl';document.documentElement.lang='ar';
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f=(x,d=2)=>{ if(x==null||!isFinite(x)) return '—'; const s=Math.abs(x).toFixed(d); return x<0&&+s!==0?'\u200E\u2212'+s:s; };
const pf=p=>p==null||!isFinite(p)?'—':p<.001?'< .001':p.toFixed(3).replace(/^0/,'');
const pstr=p=>p<.001?'p < .001':'p = '+pf(p);
const pc=(x,d=1)=>x==null||!isFinite(x)?'—':(100*x).toFixed(d)+'%';
const AR_NORM=s=>String(s).replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim().toLowerCase();
const latin=s=>s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g,'.');
function toNum(v){ if(v==null) return null; let s=latin(String(v).trim()).replace(/^\u2212/,'-').replace(/^\+/,'').replace(/\s?[%٪]$/,'');
  if(/^-?\d{1,3}([,٬]\d{3})+(\.\d+)?$/.test(s)) s=s.replace(/[,٬]/g,''); else if(/^-?\d+,\d+$/.test(s)) s=s.replace(',','.');
  if(!/^-?\d+(\.\d+)?$/.test(s)) return null; return +s; }
function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2600); }

/* ============ statistics engine ============ */
const ST={
  lg(x){ const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.1208650973866179e-2,-.5395239384953e-5]; let y=x,t=x+5.5; t-=(x+.5)*Math.log(t); let s=1.000000000190015; for(let j=0;j<6;j++) s+=c[j]/++y; return -t+Math.log(2.5066282746310005*s/x); },
  bcf(a,b,x){ const FP=1e-300; let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap; if(Math.abs(d)<FP)d=FP; d=1/d; let h=d;
    for(let m=1;m<=300;m++){ const m2=2*m; let aa=m*(b-m)*x/((qam+m2)*(a+m2)); d=1+aa*d; if(Math.abs(d)<FP)d=FP; c=1+aa/c; if(Math.abs(c)<FP)c=FP; d=1/d; h*=d*c;
      aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2)); d=1+aa*d; if(Math.abs(d)<FP)d=FP; c=1+aa/c; if(Math.abs(c)<FP)c=FP; d=1/d; const del=d*c; h*=del; if(Math.abs(del-1)<3e-14) break; } return h; },
  ibeta(x,a,b){ if(x<=0)return 0; if(x>=1)return 1; const bt=Math.exp(ST.lg(a+b)-ST.lg(a)-ST.lg(b)+a*Math.log(x)+b*Math.log(1-x)); return x<(a+1)/(a+b+2)?bt*ST.bcf(a,b,x)/a:1-bt*ST.bcf(b,a,1-x)/b; },
  gammp(a,x){ if(x<=0) return 0; if(x<a+1){ let ap=a,sum=1/a,del=sum; for(let n=0;n<500;n++){ ap++; del*=x/ap; sum+=del; if(Math.abs(del)<Math.abs(sum)*3e-14) break; } return sum*Math.exp(-x+a*Math.log(x)-ST.lg(a)); }
    const FP=1e-300; let b=x+1-a,c=1/FP,d=1/b,h=d; for(let i=1;i<=500;i++){ const an=-i*(i-a); b+=2; d=an*d+b; if(Math.abs(d)<FP)d=FP; c=b+an/c; if(Math.abs(c)<FP)c=FP; d=1/d; const del=d*c; h*=del; if(Math.abs(del-1)<3e-14) break; } return 1-Math.exp(-x+a*Math.log(x)-ST.lg(a))*h; },
  pT(t,df){ return ST.ibeta(df/(df+t*t),df/2,.5); },            // two-sided
  pF(F,d1,d2){ return F<=0?1:ST.ibeta(d2/(d2+d1*F),d2/2,d1/2); },
  pChi(x,df){ return x<=0?1:1-ST.gammp(df/2,x/2); },
  tCrit(df){ let lo=0,hi=50; for(let i=0;i<60;i++){ const m=(lo+hi)/2; ST.pT(m,df)>.05?lo=m:hi=m; } return (lo+hi)/2; },
  mean(a){ let s=0; for(const x of a) s+=x; return a.length?s/a.length:NaN; },
  vari(a){ if(a.length<2) return NaN; const m=ST.mean(a); let s=0; for(const x of a) s+=(x-m)**2; return s/(a.length-1); },
  sd(a){ return Math.sqrt(ST.vari(a)); },
  q(sorted,p){ if(!sorted.length) return NaN; const h=(sorted.length-1)*p,l=Math.floor(h); return sorted[l]+(h-l)*((sorted[l+1]??sorted[l])-sorted[l]); },
  desc(a){ const s=[...a].sort((x,y)=>x-y),n=a.length,m=ST.mean(a),sd=ST.sd(a); const se=sd/Math.sqrt(n),tc=n>1?ST.tCrit(n-1):NaN;
    let sk=NaN; if(n>2&&sd>0){ let c=0; for(const x of a) c+=((x-m)/sd)**3; sk=c*n/((n-1)*(n-2)); }
    return {n,mean:m,sd,median:ST.q(s,.5),q1:ST.q(s,.25),q3:ST.q(s,.75),min:s[0],max:s[n-1],lo:m-tc*se,hi:m+tc*se,skew:sk}; },
  rank(a){ const idx=a.map((v,i)=>[v,i]).sort((x,y)=>x[0]-y[0]),r=new Array(a.length),ties=[]; let i=0; while(i<idx.length){ let j=i; while(j+1<idx.length&&idx[j+1][0]===idx[i][0]) j++; const rk=(i+j)/2+1; for(let k=i;k<=j;k++) r[idx[k][1]]=rk; if(j>i) ties.push(j-i+1); i=j+1; } return {r,ties}; },
  pearson(x,y){ const n=x.length,mx=ST.mean(x),my=ST.mean(y); let sxy=0,sxx=0,syy=0; for(let i=0;i<n;i++){ sxy+=(x[i]-mx)*(y[i]-my); sxx+=(x[i]-mx)**2; syy+=(y[i]-my)**2; } const r=sxy/Math.sqrt(sxx*syy); const t=r*Math.sqrt((n-2)/(1-r*r)); return {r,n,p:n>2&&Math.abs(r)<1?ST.pT(t,n-2):(Math.abs(r)>=1?0:NaN)}; },
  spearman(x,y){ const o=ST.pearson(ST.rank(x).r,ST.rank(y).r); if(Math.abs(o.r)>=1&&o.n<=10){ let fct=1; for(let i=2;i<=o.n;i++) fct*=i; o.p=Math.min(1,2/fct); } return o; },
  welch(a,b){ const n1=a.length,n2=b.length,m1=ST.mean(a),m2=ST.mean(b),v1=ST.vari(a),v2=ST.vari(b); const se=Math.sqrt(v1/n1+v2/n2); if(!(se>0)){ const g=Math.sign(m1-m2); return g===0?{t:0,df:n1+n2-2,p:1,d:0}:{t:g*Infinity,df:n1+n2-2,p:0,d:g*Infinity,degenerate:true}; } const t=(m1-m2)/se; const df=(v1/n1+v2/n2)**2/((v1/n1)**2/(n1-1)+(v2/n2)**2/(n2-1)); const sp=Math.sqrt(((n1-1)*v1+(n2-1)*v2)/(n1+n2-2)); return {t,df,p:ST.pT(t,df),d:(m1-m2)/sp}; },
  anova(gs){ const all=gs.flat(),N=all.length,k=gs.length,gm=ST.mean(all); let ssb=0,ssw=0; for(const g of gs){ const m=ST.mean(g); ssb+=g.length*(m-gm)**2; for(const x of g) ssw+=(x-m)**2; } const F=(ssb/(k-1))/(ssw/(N-k)); return {F,df1:k-1,df2:N-k,p:ST.pF(F,k-1,N-k),eta2:ssb/(ssb+ssw)}; },
  kw(gs){ const all=gs.flat(),N=all.length,{r,ties}=ST.rank(all); let H=0,o=0; for(const g of gs){ let s=0; for(let i=0;i<g.length;i++) s+=r[o+i]; o+=g.length; H+=s*s/g.length; } H=12/(N*(N+1))*H-3*(N+1); let T=0; for(const t of ties) T+=t**3-t; const C=1-T/(N**3-N); H=C>0?H/C:0; const df=gs.length-1; return {H,df,p:ST.pChi(H,df),eps2:H/(N-1)}; },
  chi2(tab){ const R=tab.length,C=tab[0].length,rs=tab.map(r=>r.reduce((a,b)=>a+b,0)),cs=tab[0].map((_,j)=>tab.reduce((a,r)=>a+r[j],0)),N=rs.reduce((a,b)=>a+b,0); let x=0,low=0; for(let i=0;i<R;i++) for(let j=0;j<C;j++){ const e=rs[i]*cs[j]/N; if(e<5) low++; x+=(tab[i][j]-e)**2/e; } const df=(R-1)*(C-1); return {x,df,p:ST.pChi(x,df),v:Math.sqrt(x/(N*Math.min(R-1,C-1))),N,lowShare:low/(R*C)}; },
  alpha(M){ const k=M[0].length; if(k<2||M.length<3) return NaN; let sv=0; for(let j=0;j<k;j++) sv+=ST.vari(M.map(r=>r[j])); const tv=ST.vari(M.map(r=>r.reduce((a,b)=>a+b,0))); return k/(k-1)*(1-sv/tv); },
  bh(ps){ const m=ps.length,o=ps.map((p,i)=>[p,i]).sort((a,b)=>a[0]-b[0]),adj=new Array(m); let mn=1; for(let i=m-1;i>=0;i--){ mn=Math.min(mn,o[i][0]*m/(i+1)); adj[o[i][1]]=mn; } return adj; }
};
const esLabel=(v,cuts)=>{ if(v==null||Number.isNaN(v)) return '—'; v=Math.abs(v); return v<cuts[0]?'ضئيل':v<cuts[1]?'صغير':v<cuts[2]?'متوسط':'كبير'; };

/* ============ scale label families ============ */
const FAM=[
 {labels:['غير موافق بشدة','غير موافق','محايد','موافق','موافق بشدة'],alt:[['strongly disagree','لا اوافق بشده','غير موافق تماما','اعارض بشده'],['disagree','لا اوافق','اعارض'],['neutral','neither agree nor disagree','لا ادري'],['agree','اوافق'],['strongly agree','اوافق بشده','موافق تماما']]},
 {labels:['غير راضٍ إطلاقاً','غير راضٍ','محايد','راضٍ','راضٍ جداً'],alt:[['very dissatisfied','غير راض تماما','غير راضي تماما','غير راض اطلاقا','غير راضي اطلاقا','غير راض جدا','غير راضي جدا','مستاء جدا'],['dissatisfied','غير راض','غير راضي','مستاء'],['neutral'],['satisfied','راض','راضي'],['very satisfied','راض جدا','راضي جدا','راض تماما','راضي تماما']]},
 {labels:['أبداً','نادراً','أحياناً','غالباً','دائماً'],alt:[['never','مطلقا'],['rarely'],['sometimes'],['often'],['always']]},

/* ============ analysis ============ */
let A={};
function analyze(){

function nps(c){ const xs=vals(c),n=xs.length,p=xs.filter(x=>x>=9).length/n,d=xs.filter(x=>x<=6).length/n,se=Math.sqrt((p+d-(p-d)**2)/n); return {name:c.name,n,p,d,pa:1-p-d,score:100*(p-d),lo:Math.max(-100,100*(p-d-1.96*se)),hi:Math.min(100,100*(p-d+1.96*se))}; }

function workbook(){ const wb=XLSX.utils.book_new(),add=(n,r)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),n);
  add('المتغيرات',[['المتغير','النوع','مُجاب','مفقود','المتوسط','الانحراف المعياري','الوسيط']].concat(A.use.map(c=>{ const v=vals(c),d=c.num&&v.length>1?ST.desc(v):null; return [c.name,TYPES[c.type],v.length,S.n-v.length,d?+d.mean.toFixed(3):'',d?+d.sd.toFixed(3):'',d?d.median:'']; })));
  const fr=[['المتغير','الفئة','العدد','النسبة %']]; A.use.filter(c=>c.type==='categorical'||c.type==='scale').forEach(c=>{ const m=new Map(),L=c.type==='scale'?scaleLabels(c):null; (c.num||c.raw).forEach(v=>{ if(v!==''&&v!=null) m.set(v,(m.get(v)||0)+1); }); const t=[...m.values()].reduce((a,b)=>a+b,0); [...m].sort((a,b)=>c.num?a[0]-b[0]:b[1]-a[1]).forEach(([k,n])=>fr.push([c.name,L?(L[k-c.lo]||k):k,n,+(100*n/t).toFixed(1)])); }); add('التكرارات',fr);
  add('الفروق',[['المتغير','بحسب','الاختبار','النتيجة','p','p المعدّلة','حجم الأثر','التصنيف']].concat(A.scan.map(r=>[r.b,r.a,r.test,r.line,+r.p.toPrecision(4),+r.padj.toPrecision(4),+r.es.toFixed(3),r.esL])));
  if(A.rel) add('الثبات',[['ألفا كرونباخ',+A.rel.alpha.toFixed(3),'n',A.rel.n],[],['البند','المتوسط','الانحراف','ارتباط البند بالمجموع','ألفا عند الحذف']].concat(A.rel.rows.map(x=>[x.name,+x.mean.toFixed(3),+x.sd.toFixed(3),+x.rit.toFixed(3),isFinite(x.del)?+x.del.toFixed(3):''])));
  add('الامتثال',[['البند','الحالة','التفصيل']].concat(A.comp.auto.map(x=>[x.t,{ok:'مستوفى',warn:'يحتاج مراجعة',bad:'غير مستوفى',na:'لا ينطبق'}[x.s],x.d]),MANUAL.map(m=>[m.t,S.checks[m.id]?'مؤكَّد':'غير مؤكَّد',m.r])));
  wb.Workbook={Views:[{RTL:true}]}; return XLSX.write(wb,{type:'array',bookType:'xlsx'}); }
document.addEventListener('click',e=>{ const t=e.target.closest('button,[data-tab]'); if(!t) return;
  if(t.dataset.tab){ cur=t.dataset.tab; showTab(); return; }
  const id=t.id;
  if(id==='btnSample'){ S.pair=null; sampleData(); }
  else if(id==='btnFile') $('#file').click();
  else if(id==='btnPaste'){ const v=$('#paste').value.replace(/^[\r\n]+|\s+$/g,''); if(v){ S.pair=null; $('#paste').value=''; loadTable(parseCSV(v),'بيانات ملصوقة'); } else toast('الصق جدولاً أولاً'); }
  else if(id==='btnTest') runTest();
  else if(id==='btnComp'){ const items=A.scales.filter(c=>S.rel.has(c.name)),key=items.map(c=>c.name).sort().join('\u0001'); if(items.length<2) return; if(S.cols.some(c=>c.compKey===key)){ toast('هذا المؤشر مضاف من قبل'); return; }
    let name='مؤشر مركّب ('+items.length+' بنود)',k=1; while(S.cols.some(c=>c.name===name)) name='مؤشر مركّب '+(++k)+' ('+items.length+' بنود)';
    const raw=Array.from({length:S.n},(_,i)=>{ const r=items.map(c=>c.num[i]); return r.every(x=>x!=null)?String(+ST.mean(r).toFixed(3)):''; }); const c=makeCol(name,raw); setType(c,'numeric'); c.pii=null; c.compKey=key; S.cols.push(c); analyze(); toast('أُضيف المؤشر إلى المتغيرات'); }
  else if(id==='btnAnon') saveFile('mostabeen-anonymized.csv',anonCSV(),'text/csv');
  else if(id==='btnRep') saveFile('mostabeen-report.html','<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(S.title)+'</title><style>'+$('#app-style').textContent+'</style></head><body><div class="wrap" dir="rtl"><div class="paper">'+report()+'</div></div></body></html>','text/html');
  else if(id==='btnXls'){ if(!window.XLSX){ toast('مكتبة Excel لم تُحمَّل'); return; } saveFile('mostabeen-tables.xlsx',new Blob([workbook()]),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); }
  else if(id==='btnCopy'){ const txt=[...document.querySelectorAll('#exec li')].map(li=>'• '+li.textContent).join('\n'); (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('نُسخ الملخص'),()=>{ const r=document.createRange(); r.selectNodeContents($('#exec')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('حُدّد النص. انسخه يدوياً'); }); }
  else if(id==='btnPrint') window.print();
});
document.addEventListener('change',e=>{ const t=e.target;
  if(t.id==='file'&&t.files[0]){ readFile(t.files[0]); t.value=''; }
  else if(t.dataset.col){ const c=S.cols[+t.dataset.col],old=c.type;
    if(t.value==='scale'&&!scaleOk(c)){ toast('هذا العمود ليس مقياساً ترتيبياً: نحتاج أعداداً صحيحة من 0 إلى 10 أو تسميات معروفة'); t.value=old; return; }
    setType(c,t.value); if(t.value!=='pii') c.pii=null; S.pair=null;
    if(S.rel){ S.rel.delete(c.name); if(t.value==='scale') S.rel.add(c.name); } if(S.qi&&t.value!=='categorical') S.qi.delete(c.name);
    try{ analyze(); }catch(err){ console.error(err); setType(c,old); analyze(); toast('تعذّر تطبيق هذا النوع على العمود'); } }
  else if(t.dataset.rel){ t.checked?S.rel.add(t.dataset.rel):S.rel.delete(t.dataset.rel); analyze(); }
  else if(t.dataset.qi){ t.checked?S.qi.add(t.dataset.qi):S.qi.delete(t.dataset.qi); analyze(); }
  else if(t.dataset.check){ S.checks[t.dataset.check]=t.checked; analyze(); }
  else if(t.id==='pop'){ const v=+t.value; if(v>0&&v<S.n){ toast('حجم المجتمع لا يمكن أن يكون أقل من عدد الاستجابات'); S.pop=null; } else S.pop=v>0?v:null; analyze(); }
  else if(t.id==='title'){ S.title=t.value; $('#paper').innerHTML=report(); }
});
document.addEventListener('dragover',e=>{ const d=e.target.closest&&e.target.closest('#drop'); if(d){ e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave',e=>{ const d=e.target.closest&&e.target.closest('#drop'); if(d) d.classList.remove('over'); });
document.addEventListener('drop',e=>{ const d=e.target.closest&&e.target.closest('#drop'); if(d){ e.preventDefault(); d.classList.remove('over'); if(e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); } });
const tip=$('#tip'); document.addEventListener('mousemove',e=>{ const t=e.target.closest&&e.target.closest('[data-tip]'); if(!t){ tip.hidden=true; return; } tip.textContent=t.dataset.tip; tip.hidden=false; const w=tip.offsetWidth; tip.style.left=Math.max(6,Math.min(innerWidth-w-6,e.clientX-w/2))+'px'; tip.style.top=(e.clientY+16)+'px'; });
document.addEventListener('keydown',e=>{ const t=e.target.closest&&e.target.closest('[role=tab]'); if(!t||(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')) return; const i=TABS.findIndex(x=>x[0]===cur),j=(i+(e.key==='ArrowLeft'?1:-1)+TABS.length)%TABS.length; cur=TABS[j][0]; showTab(); $('#tab-'+cur).focus(); e.preventDefault(); });
sampleData();
</script>
