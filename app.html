<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>مستبين لتحليل الاستبانات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style id="app-style">
/* Layout: a working bench. One header, a tab rail, then a single reading column of result sheets. */
:root{
  --bg:#f1f5f4; --surface:#fcfdfc; --ink:#10282b; --ink2:#465d5c; --muted:#75878a; --line:#d5dedc;
  --accent:#0a6b6b; --accent-ink:#ffffff; --accent-soft:#dbebe9; --mark:#f3d27a;
  --s1:#2a78d6; --neg3:#c43c3c; --neg2:#e27f7f; --neg1:#f2b8b8; --mid:#dcdcd6; --pos1:#b7d3f6; --pos2:#6da7ec; --pos3:#256abf;
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --crit:#d03b3b;
  --display:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1415; --surface:#121e1f; --ink:#e8efee; --ink2:#b3c3c1; --muted:#80928f; --line:#263637;
  --accent:#43b8b0; --accent-ink:#04201f; --accent-soft:#16302f; --mark:#6b5514;
  --s1:#3987e5; --mid:#4a4a46; --good-ink:#35c435; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0b1415; --surface:#121e1f; --ink:#e8efee; --ink2:#b3c3c1; --muted:#80928f; --line:#263637;
  --accent:#43b8b0; --accent-ink:#04201f; --accent-soft:#16302f; --mark:#6b5514;
  --s1:#3987e5; --mid:#4a4a46; --good-ink:#35c435; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7}
.wrap{max-width:1080px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.35}
h1{font-size:1.35rem} h2{font-size:1.15rem} h3{font-size:.98rem;font-weight:500}
p{margin:0} .num,td.n,th.n{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)} .small{font-size:.85rem}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand b{font-family:var(--display);font-size:1.5rem;color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:6px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--accent)}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
.banner{background:var(--mark);color:#10282b;padding:8px 14px;border-radius:6px;font-size:.9rem}
:root[data-theme="dark"] .banner{color:#f5ecd0}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .banner{color:#f5ecd0} }
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{border:0;background:none;border-radius:0;padding:10px 14px;color:var(--ink2);white-space:nowrap;border-bottom:3px solid transparent}
nav.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
section.panel{display:flex;flex-direction:column;gap:18px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sheet>header{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:2px}
.tile .k{font-size:.82rem;color:var(--ink2)} .tile .v{font-family:var(--mono);font-size:1.7rem;line-height:1.3;direction:ltr;text-align:right}
.tile .s{font-size:.8rem;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{font-weight:600;color:var(--ink2);font-size:.82rem;white-space:nowrap}
td.n,th.n{text-align:left}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:99px;font-size:.8rem;border:1px solid var(--line);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok::before{background:var(--good)} .pill.warn::before{background:var(--warn)} .pill.bad::before{background:var(--crit)}
/* bars */
.bars{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:minmax(90px,220px) 1fr 92px;gap:10px;align-items:center}
.blab{font-size:.88rem;min-width:0;overflow-wrap:anywhere}
.btrack{height:14px;display:flex}
.bfill{background:var(--s1);height:100%;border-start-end-radius:4px;border-end-end-radius:4px;min-width:2px}
.bval{font-family:var(--mono);font-size:.82rem;direction:ltr;text-align:left;color:var(--ink2)}
.lhead,.lrow{display:grid;grid-template-columns:minmax(120px,300px) 1fr 54px 62px;gap:10px;align-items:center}
.lhead{font-size:.78rem;color:var(--muted)}
.lstack{display:flex;gap:2px;height:22px;min-width:0}
.seg{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.72rem;overflow:hidden;min-width:2px;color:#0b0b0b}
.seg.w{color:#fff} .seg.m{color:var(--ink)}
.lnum{font-family:var(--mono);font-size:.85rem;direction:ltr;text-align:left}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--ink2)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}
.hist{display:flex;align-items:flex-end;gap:2px;height:110px;direction:ltr;border-bottom:1px solid var(--line)}
.hist div{flex:1;background:var(--s1);border-radius:4px 4px 0 0;min-height:1px}
.haxis{display:flex;justify-content:space-between;direction:ltr;font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.heat td,.heat th{text-align:center;padding:5px;font-size:.78rem;border:2px solid var(--surface)}
.heat th{white-space:normal;max-width:130px;font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px}
.stat{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;background:var(--accent-soft);padding:2px 8px;border-radius:4px;display:inline-block}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
ul.clean{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.check{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.check small{grid-column:2;color:var(--muted)}
.meter{height:10px;background:var(--line);border-radius:5px;overflow:hidden;display:flex}
.meter div{background:var(--accent)}
.drop{border:2px dashed var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:10px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:4px 9px;border-radius:5px;font-size:.8rem;max-width:260px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:0;margin-inline:auto;width:fit-content;max-width:90%;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;z-index:60}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:clamp(18px,4vw,44px);display:flex;flex-direction:column;gap:20px}
.paper h1{font-size:1.6rem} .paper h2{border-bottom:2px solid var(--accent);padding-bottom:4px}
.paper section{display:flex;flex-direction:column;gap:10px}
.paper p,.paper li{max-width:70ch}
@media (max-width:620px){
  .scroll>table:has(thead){min-width:640px}
  .brow{grid-template-columns:1fr 84px} .brow .blab{grid-column:1/-1}
  .lhead{display:none} .lrow{grid-template-columns:1fr 50px 58px} .lrow .blab{grid-column:1/-1}
}
@media print{ nav.tabs,header.top,.noprint,.banner{display:none!important} body{background:#fff} .paper{border:0;padding:0} section.panel[hidden]{display:none!important} }
</style>

<div class="wrap" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand"><b>مُستبين</b><span class="muted">تحليل الاستبانات والجداول والمستندات · الإحصاء · الامتثال · التقارير</span></div>
    <div class="actions">
      <button class="primary" id="btnFile" type="button">حمّل ملفاً</button>
      <input type="file" id="file" accept=".csv,.tsv,.txt,.md,.xlsx,.xls,.docx,.pdf" hidden>
      <button id="btnSample">استبانة تجريبية</button>
      <button id="btnSampleDoc">مستند تجريبي</button>
    </div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="panels"></main>
</div>
<div id="tip" hidden></div><div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
document.documentElement.dir='rtl';document.documentElement.lang='ar';
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f=(x,d=2)=>{ if(x==null||!isFinite(x)) return '—'; const s=Math.abs(x).toFixed(d); return x<0&&+s!==0?'\u200E\u2212'+s:s; };
const pf=p=>p==null||!isFinite(p)?'—':p<.001?'< .001':p.toFixed(3).replace(/^0/,'');
const pstr=p=>p<.001?'p < .001':'p = '+pf(p);
const pc=(x,d=1)=>x==null||!isFinite(x)?'—':(100*x).toFixed(d)+'%';
const AR_NORM=s=>String(s).replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim().toLowerCase();
const latin=s=>s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g,'.');
function toNum(v){ if(v==null) return null; let s=latin(String(v).trim()).replace(/^\u2212/,'-').replace(/^\+/,'').replace(/\s?[%٪]$/,'');
  if(/^-?\d{1,3}([,٬]\d{3})+(\.\d+)?$/.test(s)) s=s.replace(/[,٬]/g,''); else if(/^-?\d+,\d+$/.test(s)) s=s.replace(',','.');
  if(!/^-?\d+(\.\d+)?$/.test(s)) return null; return +s; }
const amin=a=>{ let m=Infinity; for(const x of a) if(x<m) m=x; return m; }, amax=a=>{ let m=-Infinity; for(const x of a) if(x>m) m=x; return m; };
function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2600); }

/* ============ statistics engine ============ */
const ST={
  lg(x){ const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.1208650973866179e-2,-.5395239384953e-5]; let y=x,t=x+5.5; t-=(x+.5)*Math.log(t); let s=1.000000000190015; for(let j=0;j<6;j++) s+=c[j]/++y; return -t+Math.log(2.5066282746310005*s/x); },
  bcf(a,b,x){ const FP=1e-300; let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap; if(Math.abs(d)<FP)d=FP; d=1/d; let h=d;
    for(let m=1;m<=300;m++){ const m2=2*m; let aa=m*(b-m)*x/((qam+m2)*(a+m2)); d=1+aa*d; if(Math.abs(d)<FP)d=FP; c=1+aa/c; if(Math.abs(c)<FP)c=FP; d=1/d; h*=d*c;
      aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2)); d=1+aa*d; if(Math.abs(d)<FP)d=FP; c=1+aa/c; if(Math.abs(c)<FP)c=FP; d=1/d; const del=d*c; h*=del; if(Math.abs(del-1)<3e-14) break; } return h; },
  ibeta(x,a,b){ if(x<=0)return 0; if(x>=1)return 1; const bt=Math.exp(ST.lg(a+b)-ST.lg(a)-ST.lg(b)+a*Math.log(x)+b*Math.log(1-x)); return x<(a+1)/(a+b+2)?bt*ST.bcf(a,b,x)/a:1-bt*ST.bcf(b,a,1-x)/b; },
  gammp(a,x){ if(x<=0) return 0; if(x<a+1){ let ap=a,sum=1/a,del=sum; for(let n=0;n<500;n++){ ap++; del*=x/ap; sum+=del; if(Math.abs(del)<Math.abs(sum)*3e-14) break; } return sum*Math.exp(-x+a*Math.log(x)-ST.lg(a)); }
    const FP=1e-300; let b=x+1-a,c=1/FP,d=1/b,h=d; for(let i=1;i<=500;i++){ const an=-i*(i-a); b+=2; d=an*d+b; if(Math.abs(d)<FP)d=FP; c=b+an/c; if(Math.abs(c)<FP)c=FP; d=1/d; const del=d*c; h*=del; if(Math.abs(del-1)<3e-14) break; } return 1-Math.exp(-x+a*Math.log(x)-ST.lg(a))*h; },
  pT(t,df){ return ST.ibeta(df/(df+t*t),df/2,.5); },            // two-sided
  pF(F,d1,d2){ return F<=0?1:ST.ibeta(d2/(d2+d1*F),d2/2,d1/2); },
  pChi(x,df){ return x<=0?1:1-ST.gammp(df/2,x/2); },
  tCrit(df){ let lo=0,hi=50; for(let i=0;i<60;i++){ const m=(lo+hi)/2; ST.pT(m,df)>.05?lo=m:hi=m; } return (lo+hi)/2; },
  mean(a){ let s=0; for(const x of a) s+=x; return a.length?s/a.length:NaN; },
  vari(a){ if(a.length<2) return NaN; const m=ST.mean(a); let s=0; for(const x of a) s+=(x-m)**2; return s/(a.length-1); },
  sd(a){ return Math.sqrt(ST.vari(a)); },
  q(sorted,p){ if(!sorted.length) return NaN; const h=(sorted.length-1)*p,l=Math.floor(h); return sorted[l]+(h-l)*((sorted[l+1]??sorted[l])-sorted[l]); },
  desc(a){ const s=[...a].sort((x,y)=>x-y),n=a.length,m=ST.mean(a),sd=ST.sd(a); const se=sd/Math.sqrt(n),tc=n>1?ST.tCrit(n-1):NaN;
    let sk=NaN; if(n>2&&sd>0){ let c=0; for(const x of a) c+=((x-m)/sd)**3; sk=c*n/((n-1)*(n-2)); }
    return {n,mean:m,sd,median:ST.q(s,.5),q1:ST.q(s,.25),q3:ST.q(s,.75),min:s[0],max:s[n-1],lo:m-tc*se,hi:m+tc*se,skew:sk}; },
  rank(a){ const idx=a.map((v,i)=>[v,i]).sort((x,y)=>x[0]-y[0]),r=new Array(a.length),ties=[]; let i=0; while(i<idx.length){ let j=i; while(j+1<idx.length&&idx[j+1][0]===idx[i][0]) j++; const rk=(i+j)/2+1; for(let k=i;k<=j;k++) r[idx[k][1]]=rk; if(j>i) ties.push(j-i+1); i=j+1; } return {r,ties}; },
  pearson(x,y){ const n=x.length,mx=ST.mean(x),my=ST.mean(y); let sxy=0,sxx=0,syy=0; for(let i=0;i<n;i++){ sxy+=(x[i]-mx)*(y[i]-my); sxx+=(x[i]-mx)**2; syy+=(y[i]-my)**2; } const r=sxy/Math.sqrt(sxx*syy); const t=r*Math.sqrt((n-2)/(1-r*r)); return {r,n,p:n>2&&Math.abs(r)<1?ST.pT(t,n-2):(Math.abs(r)>=1?0:NaN)}; },
  spearman(x,y){ const o=ST.pearson(ST.rank(x).r,ST.rank(y).r); if(Math.abs(o.r)>=1&&o.n<=10){ let fct=1; for(let i=2;i<=o.n;i++) fct*=i; o.p=Math.min(1,2/fct); } return o; },
  welch(a,b){ const n1=a.length,n2=b.length,m1=ST.mean(a),m2=ST.mean(b),v1=ST.vari(a),v2=ST.vari(b); const se=Math.sqrt(v1/n1+v2/n2); if(!(se>0)){ const g=Math.sign(m1-m2); return g===0?{t:0,df:n1+n2-2,p:1,d:0}:{t:g*Infinity,df:n1+n2-2,p:0,d:g*Infinity,degenerate:true}; } const t=(m1-m2)/se; const df=(v1/n1+v2/n2)**2/((v1/n1)**2/(n1-1)+(v2/n2)**2/(n2-1)); const sp=Math.sqrt(((n1-1)*v1+(n2-1)*v2)/(n1+n2-2)); return {t,df,p:ST.pT(t,df),d:(m1-m2)/sp}; },
  anova(gs){ const all=gs.flat(),N=all.length,k=gs.length,gm=ST.mean(all); let ssb=0,ssw=0; for(const g of gs){ const m=ST.mean(g); ssb+=g.length*(m-gm)**2; for(const x of g) ssw+=(x-m)**2; } const F=(ssb/(k-1))/(ssw/(N-k)); return {F,df1:k-1,df2:N-k,p:ST.pF(F,k-1,N-k),eta2:ssb/(ssb+ssw)}; },
  kw(gs){ const all=gs.flat(),N=all.length,{r,ties}=ST.rank(all); let H=0,o=0; for(const g of gs){ let s=0; for(let i=0;i<g.length;i++) s+=r[o+i]; o+=g.length; H+=s*s/g.length; } H=12/(N*(N+1))*H-3*(N+1); let T=0; for(const t of ties) T+=t**3-t; const C=1-T/(N**3-N); H=C>0?H/C:0; const df=gs.length-1; return {H,df,p:ST.pChi(H,df),eps2:H/(N-1)}; },
  chi2(tab){ const R=tab.length,C=tab[0].length,rs=tab.map(r=>r.reduce((a,b)=>a+b,0)),cs=tab[0].map((_,j)=>tab.reduce((a,r)=>a+r[j],0)),N=rs.reduce((a,b)=>a+b,0); let x=0,low=0; for(let i=0;i<R;i++) for(let j=0;j<C;j++){ const e=rs[i]*cs[j]/N; if(e<5) low++; x+=(tab[i][j]-e)**2/e; } const df=(R-1)*(C-1); return {x,df,p:ST.pChi(x,df),v:Math.sqrt(x/(N*Math.min(R-1,C-1))),N,lowShare:low/(R*C)}; },
  alpha(M){ const k=M[0].length; if(k<2||M.length<3) return NaN; let sv=0; for(let j=0;j<k;j++) sv+=ST.vari(M.map(r=>r[j])); const tv=ST.vari(M.map(r=>r.reduce((a,b)=>a+b,0))); return k/(k-1)*(1-sv/tv); },
  bh(ps){ const m=ps.length,o=ps.map((p,i)=>[p,i]).sort((a,b)=>a[0]-b[0]),adj=new Array(m); let mn=1; for(let i=m-1;i>=0;i--){ mn=Math.min(mn,o[i][0]*m/(i+1)); adj[o[i][1]]=mn; } return adj; }
};
const esLabel=(v,cuts)=>{ if(v==null||Number.isNaN(v)) return '—'; v=Math.abs(v); return v<cuts[0]?'ضئيل':v<cuts[1]?'صغير':v<cuts[2]?'متوسط':'كبير'; };

/* ============ scale label families ============ */

/* ============ assessment: strengths, weaknesses, defects, actions (rule-based, every line cites its evidence) ============ */
const norm01=(c,x)=>(x-c.lo)/((c.hi-c.lo)||1);
function insights(){ const st=[],wk=[],df=[],ac=[],cn=[],q=A.q,sc=A.scales,add=(arr,t,e)=>arr.push({t,e});
  const items=sc.map(c=>{ const xs=vals(c); return {c,n:xs.length,m:ST.mean(xs),p:norm01(c,ST.mean(xs)),top:xs.filter(x=>x>=c.hi-1).length/xs.length,bot:xs.filter(x=>x<=c.lo+1).length/xs.length}; }).filter(x=>x.n>=5).sort((a,b)=>b.p-a.p);
  /* importance: association of each item with the outcome (NPS if present, otherwise the mean of the other items) */
  const out=A.nps?S.cols.find(c=>c.name===A.nps.name):null;
  items.forEach(it=>{ const x=[],y=[]; for(let i=0;i<S.n;i++){ const v=it.c.num[i]; if(v==null) continue; let o=null; if(out) o=out.num[i]; else{ const r=sc.filter(c=>c!==it.c).map(c=>c.num[i]).filter(z=>z!=null); if(r.length) o=ST.mean(r); } if(o!=null){ x.push(v); y.push(o); } } it.imp=x.length>=10?ST.spearman(x,y).r:NaN; });
  const imps=items.map(i=>i.imp).filter(isFinite).sort((a,b)=>a-b),medImp=imps.length?ST.q(imps,.5):NaN;
  items.forEach(it=>{ const ev=`المتوسط ${f(it.m)} من ${it.c.hi}، أعلى خيارين ${pc(it.top,0)}، أدنى خيارين ${pc(it.bot,0)}، n = ${it.n}`;
    if(it.p>=.68&&it.top>=.55) add(st,`«${it.c.name}» بند قوي`,ev);
    else if(it.p<.5||it.bot>=.3) add(wk,`«${it.c.name}» بند ضعيف`,ev); });
  if(A.nps){ const n=A.nps,ev=`NPS = ${f(n.score,0)}، فترة الثقة 95% من ${f(n.lo,0)} إلى ${f(n.hi,0)}، n = ${n.n}`; if(n.lo>0) add(st,'صافي نقاط الترويج موجب بثقة',ev); else if(n.hi<0) add(wk,'صافي نقاط الترويج سالب بثقة',ev); else add(cn,'صافي نقاط الترويج لا يختلف عن الصفر بثقة كافية',ev); }
  /* groups that sit below the rest on significant, non-trivial differences */
  const low=new Map(); A.scan.filter(r=>r.padj<.05&&r.detail&&r.detail.kind==='groups'&&r.esL!=='ضئيل').forEach(r=>{ const g=[...r.detail.rows].sort((a,b)=>a.mean-b.mean)[0],k=r.a+'\u0001'+g.g; if(!low.has(k)) low.set(k,{by:r.a,g:g.g,n:g.n,vars:[]}); low.get(k).vars.push(r.b); });
  const lows=[...low.values()].sort((a,b)=>b.vars.length-a.vars.length).filter((l,i,arr)=>l.vars.length>=2||arr[0].vars.length<2);
  lows.slice(0,4).forEach(l=>add(wk,`فئة «${l.g}» (${l.by}) هي الأدنى في ${l.vars.length} متغير بفروق دالة`,`n = ${l.n}. المتغيرات: ${l.vars.slice(0,4).join('، ')}${l.vars.length>4?' وغيرها':''}. بعد تصحيح بنجاميني–هوكبرغ.`));
  if(A.rel){ const a=A.rel.alpha,ev=`ألفا كرونباخ = ${f(a,3)} على ${A.rel.k} بنود، n = ${A.rel.n}`; if(a>=.8) add(st,'المقياس متسق داخلياً',ev); else if(a<.7) add(df,'ثبات المقياس دون 0.70، فلا يصح جمع بنوده في مؤشر واحد',ev);
    A.rel.rows.filter(r=>r.rit<.3).forEach(r=>add(df,`البند «${r.name}» ضعيف الارتباط ببقية المقياس${r.rit<0?' وقد يكون معكوس الصياغة':''}`,`ارتباط البند بالمجموع المصحّح = ${f(r.rit,3)}`)); }
  /* defects in the data and the method */
  if(S.n<30) add(df,'العينة أصغر من 30، والاختبارات الإحصائية ضعيفة القوة',`n = ${S.n}`); else if(S.n>=100) add(st,'حجم العينة كافٍ للمقارنات الأساسية',`n = ${S.n}، هامش الخطأ ±${f(100*moe(S.n,S.pop),1)}%`);
  if(q.missRate>=.05) add(df,'نسبة القيم المفقودة مرتفعة',`${pc(q.missRate)} من خلايا الأسئلة المغلقة (${q.miss} من ${q.cells})`); else if(q.cells) add(st,'القيم المفقودة قليلة',pc(q.missRate)+' من خلايا الأسئلة المغلقة');
  if(q.dup) add(df,'توجد صفوف مكررة بالكامل',`${q.dup} صف`);
  if(sc.length>=5&&q.straight/S.n>=.03) add(df,'استجابات نمطية اختارت الخيار نفسه لكل البنود',`${q.straight} استجابة (${pc(q.straight/S.n)})`);
  if(q.speed&&q.speed.n) add(df,'إجابات متعجّلة قد لا تعكس قراءة الأسئلة',`${q.speed.n} استجابة أقل من ثلث وسيط المدة (${f(q.speed.cut,0)})`);
  const cp=A.comp; if(cp.pii.length) add(df,'الملف يحتوي أعمدة بيانات شخصية مباشرة',cp.pii.map(p=>`${p.name} (${p.kind})`).join('، '));
  if(cp.kan&&cp.kan.risk/S.n>.1) add(df,'خطر إعادة التعرّف على الأفراد مرتفع',`${cp.kan.risk} سجل (${pc(cp.kan.risk/S.n)}) في مجموعات أقل من 5، منها ${cp.kan.uniq} فريد`);
  if(!S.checks.prob) add(df,'لم يُؤكَّد أن العينة احتمالية، فلا تُعمَّم النتائج على المجتمع',"البند «العينة احتمالية» في قائمة الامتثال غير مؤكَّد");
  /* actions, most consequential first */
  const pri=items.filter(it=>it.p<.6&&isFinite(it.imp)&&it.imp>=medImp&&it.imp>=.3).sort((a,b)=>(b.imp-b.p)-(a.imp-a.p)).slice(0,3);
  pri.forEach(it=>add(ac,`ابدأ بتحسين «${it.c.name}»`,`أداء منخفض (${f(it.m)} من ${it.c.hi}) مع ارتباط مرتفع بـ${out?'نية التوصية':'بقية المقياس'} (ρ = ${f(it.imp)}). الارتباط لا يثبت السببية.`));
  const rest=items.filter(it=>(it.p<.5||it.bot>=.3)&&!pri.includes(it)).slice(-2); rest.forEach(it=>add(ac,`عالج «${it.c.name}»`,`${pc(it.bot,0)} اختاروا أدنى خيارين، والمتوسط ${f(it.m)} من ${it.c.hi}`));
  lows.slice(0,2).forEach(l=>add(ac,`ابحث أسباب انخفاض فئة «${l.g}» بمقابلات أو مجموعة تركيز`,`الأدنى في ${l.vars.length} متغير بحسب «${l.by}»`));
  if(q.dup||(sc.length>=5&&q.straight)||(q.speed&&q.speed.n)) add(ac,'نظّف البيانات ثم أعد التحليل وقارن النتيجتين',[q.dup?`${q.dup} مكرر`:'',sc.length>=5&&q.straight?`${q.straight} نمطي`:'',q.speed&&q.speed.n?`${q.speed.n} متعجّل`:''].filter(Boolean).join('، '));
  if(cp.pii.length||cp.tp.length) add(ac,'احذف المعرّفات المباشرة قبل مشاركة الملف','استخدم زر التنزيل بلا معرّفات مباشرة في تبويب الامتثال، ثم راجع النصوص المفتوحة يدوياً');
  if(cp.kan&&cp.kan.risk) add(ac,'ادمج الفئات الصغيرة قبل نشر الجداول التفصيلية',`${cp.small.length} فئة أقل من 5`);
  if(!S.checks.prob&&S.n>=30) add(ac,'وثّق طريقة سحب العينة، وطبّق أوزان ترجيح إن اختلفت تركيبة المجيبين عن المجتمع','مستبين لا يطبّق الترجيح، فاستخدم SPSS أو R لهذه الخطوة');
  A.rel&&A.rel.rows.filter(r=>r.rit<.3).slice(0,2).forEach(r=>add(ac,`راجع صياغة البند «${r.name}» أو احذفه من المؤشر`,`ألفا عند الحذف = ${f(r.del,3)}`));
  /* conclusions */
  if(items.length){ const ov=ST.mean(items.map(i=>i.p)),top=ST.mean(items.map(i=>i.top)); add(cn,`التقييم العام ${ov>=.68?'إيجابي':ov>=.5?'متوسط يميل إلى الإيجاب':ov>=.4?'متوسط يميل إلى السلب':'سلبي'}`,`متوسط البنود على مقياس موحّد من 0 إلى 100 = ${f(100*ov,0)}، ومتوسط نسبة أعلى خيارين ${pc(top,0)} على ${items.length} بنود`);
    if(items.length>2) add(cn,`الفجوة بين أعلى بند وأدناه ${f(100*(items[0].p-items[items.length-1].p),0)} نقطة من 100`,`«${items[0].c.name}» مقابل «${items[items.length-1].c.name}»`); }
  const sig=A.scan.filter(r=>r.padj<.05); if(A.scan.length) add(cn,sig.length?`الفروق بين الفئات حقيقية في ${sig.length} من ${A.scan.length} مقارنة`:'لا فروق دالة بين الفئات، فالنتائج متقاربة عبر المجموعات',sig.length?`أكثر المتغيرات تفريقاً: ${[...new Set(sig.map(r=>r.a))].slice(0,3).join('، ')}`:'بعد تصحيح المقارنات المتعددة');
  const conf=df.length>=4?'منخفضة':df.length>=2?'متوسطة':'جيدة'; add(cn,`درجة الثقة في هذه الاستنتاجات ${conf}`,`${df.length} خلل منهجي أو في البيانات مرصود`);
  return {st,wk,df,ac,cn}; }

async function readPdf(buf,name){ await loadLib('pdf'); const lib=window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc=LIB.pdf[0]; const pdf=await lib.getDocument({data:buf,isEvalSupported:false}).promise,lines=[];

    for(const it of tc.items){ if(!it.str) continue; const y=it.transform[5],x=it.transform[4],h=it.height||Math.abs(it.transform[3])||10,w=it.width||0;
      if(cur&&Math.abs(y-cur.y)<Math.max(h,cur.h)*.5){ const gap=Math.min(Math.abs(x-(prev.x+prev.w)),Math.abs(prev.x-(x+w))); cur.text+=(gap>.2*h&&!/\s$/.test(cur.text)&&!/^\s/.test(it.str)?' ':'')+it.str; cur.h=Math.max(cur.h,h); }

function showTab(){ TABS.forEach(([k])=>{ const p=$('#p-'+k),t=$('#tab-'+k); if(p&&k===cur&&p.dataset.stale){ p.innerHTML=panelHTML(k); delete p.dataset.stale; if(k==='data'&&$('#paste')) $('#paste').value=S.pasted||''; if(k==='rel'&&S.pair&&$('#va')&&$('#va').querySelector(`option[value="${S.pair[0]}"]`)&&$('#vb').querySelector(`option[value="${S.pair[1]}"]`)){ $('#va').value=S.pair[0]; $('#vb').value=S.pair[1]; if(S.hadTest) runTest(); } } if(p) p.hidden=k!==cur; if(t){ t.setAttribute('aria-selected',k===cur); t.tabIndex=k===cur?0:-1; } }); }
function panelHTML(k){ if(P[k]) return P[k](); const m=MODS.find(x=>x.id===k); return m?modCall(m,'render'):''; }
function render(){ const act=document.activeElement&&document.activeElement.id, paste=$('#paste')?$('#paste').value:(S.pasted||''), doc=S.mode==='doc';
  TABS=tabsFor(doc?'doc':'table'); if(!TABS.some(t=>t[0]===cur)) cur=TABS[0][0];
  const b=$('#banner'); b.hidden=!(doc?D.sample:S.sample); b.textContent=doc?'تعرض الصفحة الآن مستنداً تجريبياً مكتوباً للعرض. حمّل ملفك لتحليل محتواه.':'تعرض الصفحة الآن بيانات تجريبية مولّدة آلياً (242 استجابة افتراضية). حمّل ملفك لتحليل بياناتك.';
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button role="tab" id="tab-${k}" data-tab="${k}" aria-controls="p-${k}" aria-selected="${k===cur}">${l}</button>`).join('');
  $('#panels').innerHTML=TABS.map(([k])=>`<section class="panel" role="tabpanel" aria-labelledby="tab-${k}" id="p-${k}" data-stale="1" hidden></section>`).join('');
  S.pasted=paste; showTab(); if($('#paste')) $('#paste').value=paste;
  if(act){ const e=document.getElementById(act); if(e) e.focus({preventScroll:true}); } }
function runTest(){ const a=S.cols[+$('#va').value],b=S.cols[+$('#vb').value],o=$('#testOut'); S.pair=[$('#va').value,$('#vb').value]; S.hadTest=true; if(!a||!b||a===b){ o.innerHTML='<p class="muted">اختر متغيرين مختلفين.</p>'; return; }
  const t=testPair(a,b); if(t&&(Number.isNaN(t.p)||Number.isNaN(t.es))){ o.innerHTML='<p class="muted">تعذّر حساب الاختبار: أحد المتغيرين أو إحدى المجموعات بلا تباين.</p>'; return; } if(!t){ o.innerHTML='<p class="muted">لا يمكن اختبار هذا الزوج: نحتاج مجموعتين على الأقل في كل منهما مشاهدتان.</p>'; return; }
  let d=''; if(t.detail&&t.detail.kind==='groups') d=`<div class="scroll"><table><thead><tr><th>المجموعة</th><th class="n">n</th><th class="n">المتوسط</th><th class="n">الوسيط</th><th class="n">الانحراف</th></tr></thead><tbody>${t.detail.rows.sort((x,y)=>y.mean-x.mean).map(r=>`<tr><td>${esc(r.g)}</td><td class="n">${r.n}</td><td class="n">${f(r.mean)}</td><td class="n">${f(r.median)}</td><td class="n">${f(r.sd)}</td></tr>`).join('')}</tbody></table></div>`;
  if(t.detail&&t.detail.kind==='xtab'){ const {R,C,tab}=t.detail; d=`<div class="scroll"><table><thead><tr><th>نسب الصف</th>${C.map(x=>`<th class="n">${esc(x)}</th>`).join('')}<th class="n">n</th></tr></thead><tbody>${R.map((r,i)=>{ const s=tab[i].reduce((p,q)=>p+q,0); return `<tr><td>${esc(r)}</td>${tab[i].map(v=>`<td class="n">${pc(v/s,0)}</td>`).join('')}<td class="n">${s}</td></tr>`; }).join('')}</tbody></table></div>`; }
  o.innerHTML=`<p><b>${t.test}</b> · <span class="stat">${t.line}</span></p><p>${t.p<.05?'العلاقة دالة إحصائياً عند 5%':'لا دليل كافياً على وجود علاقة عند 5%'}، وحجم الأثر <b>${t.esL}</b> (${t.esName}). هذا اختبار منفرد غير مصحّح للمقارنات المتعددة.</p>${t.warn?`<p class="small"><span class="pill warn">تنبيه</span> ${t.warn}</p>`:''}${d}`; }
async function saveFile(filename,data,mime){ let d=null; try{ d=window.claude&&window.claude.use?await window.claude.use('downloads'):null; }catch(e){}
  if(d){ try{ await d.save({filename,data}); toast('حُفظ الملف'); }catch(e){ if(!e||e.code!=='declined') toast('تعذّر حفظ الملف في هذا العرض'); } return; }
  if(window.claude){ toast('التنزيل غير متاح في هذا العرض'); return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:mime})); a.download=filename; document.body.appendChild(a); a.click(); a.remove(); }
const csvCell=v=>{ v=String(v??''); if(/^[=+\-@\t\r]/.test(v)&&!/^[+-]?\d+([.,]\d+)?$/.test(v)) v="'"+v; return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
function anonCSV(){ const cols=S.cols.filter(c=>!['pii','id','ignore'].includes(c.type)); return '﻿'+[cols.map(c=>csvCell(c.name)).join(',')].concat(Array.from({length:S.n},(_,i)=>cols.map(c=>csvCell(c.num?c.raw[i]:scrub(c.raw[i]))).join(','))).join('\n'); }
function workbook(){ const wb=XLSX.utils.book_new(),add=(n,r)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),n);
  add('المتغيرات',[['المتغير','النوع','مُجاب','مفقود','المتوسط','الانحراف المعياري','الوسيط']].concat(A.use.map(c=>{ const v=vals(c),d=c.num&&v.length>1?ST.desc(v):null; return [c.name,TYPES[c.type],v.length,S.n-v.length,d?+d.mean.toFixed(3):'',d?+d.sd.toFixed(3):'',d?d.median:'']; })));
  const fr=[['المتغير','الفئة','العدد','النسبة %']]; A.use.filter(c=>c.type==='categorical'||c.type==='scale').forEach(c=>{ const m=new Map(),L=c.type==='scale'?scaleLabels(c):null; (c.num||c.raw).forEach(v=>{ if(v!==''&&v!=null) m.set(v,(m.get(v)||0)+1); }); const t=[...m.values()].reduce((a,b)=>a+b,0); [...m].sort((a,b)=>c.num?a[0]-b[0]:b[1]-a[1]).forEach(([k,n])=>fr.push([c.name,L?(L[k-c.lo]||k):k,n,+(100*n/t).toFixed(1)])); }); add('التكرارات',fr);
  add('الفروق',[['المتغير','بحسب','الاختبار','النتيجة','p','p المعدّلة','حجم الأثر','التصنيف']].concat(A.scan.map(r=>[r.b,r.a,r.test,r.line,+r.p.toPrecision(4),+r.padj.toPrecision(4),+r.es.toFixed(3),r.esL])));
  if(A.rel) add('الثبات',[['ألفا كرونباخ',+A.rel.alpha.toFixed(3),'n',A.rel.n],[],['البند','المتوسط','الانحراف','ارتباط البند بالمجموع','ألفا عند الحذف']].concat(A.rel.rows.map(x=>[x.name,+x.mean.toFixed(3),+x.sd.toFixed(3),+x.rit.toFixed(3),isFinite(x.del)?+x.del.toFixed(3):''])));
  add('الامتثال',[['البند','الحالة','التفصيل']].concat(A.comp.auto.map(x=>[x.t,{ok:'مستوفى',warn:'يحتاج مراجعة',bad:'غير مستوفى',na:'لا ينطبق'}[x.s],x.d]),MANUAL.map(m=>[m.t,S.checks[m.id]?'مؤكَّد':'غير مؤكَّد',m.r])));
  wb.Workbook={Views:[{RTL:true}]}; return XLSX.write(wb,{type:'array',bookType:'xlsx'}); }

document.addEventListener('change',e=>{ const t=e.target;
  for(const m of MODS) if(modCall(m,'change',t,e)===true) return;
  if(t.id==='file'&&t.files[0]){ readFile(t.files[0]); t.value=''; }
  else if(t.id==='sheetSel'){ S.book.cur=t.value; loadTable(tableFrom(S.book.sheets[t.value]),S.book.name+' · '+t.value,false,true); }
  else if(t.dataset.dcheck){ D.checks[t.dataset.dcheck]=t.checked; analyzeDoc(); render(); }
  else if(t.dataset.col){ const c=S.cols[+t.dataset.col],old=c.type;
    if(t.value==='scale'&&!scaleOk(c)){ toast('هذا العمود ليس مقياساً ترتيبياً: نحتاج أعداداً صحيحة من 0 إلى 10 أو تسميات معروفة'); t.value=old; return; }
    setType(c,t.value); if(t.value!=='pii') c.pii=null; S.pair=null;
    if(S.rel){ S.rel.delete(c.name); if(t.value==='scale') S.rel.add(c.name); } if(S.qi&&t.value!=='categorical') S.qi.delete(c.name);
    try{ analyze(); }catch(err){ console.error(err); setType(c,old); analyze(); toast('تعذّر تطبيق هذا النوع على العمود'); } }
  else if(t.dataset.rel){ t.checked?S.rel.add(t.dataset.rel):S.rel.delete(t.dataset.rel); analyze(); }
  else if(t.dataset.qi){ t.checked?S.qi.add(t.dataset.qi):S.qi.delete(t.dataset.qi); analyze(); }
  else if(t.dataset.check){ S.checks[t.dataset.check]=t.checked; analyze(); }
  else if(t.id==='pop'){ const v=+t.value; if(v>0&&v<S.n){ toast('حجم المجتمع لا يمكن أن يكون أقل من عدد الاستجابات'); S.pop=null; } else S.pop=v>0?v:null; analyze(); }
  else if(t.id==='title'){ S.title=t.value; $('#paper').innerHTML=report(); }
});

/* ---- module: 10-posthoc.js ---- */
(function(){
  /* ---------- pure functions (tested against SciPy in tests/posthoc.test.js) ---------- */
  const med = a => { const s = [...a].sort((x, y) => x - y), n = s.length, h = n >> 1; return n % 2 ? s[h] : (s[h - 1] + s[h]) / 2; };

  // Two-sided p-value of a standard normal statistic, through the regularised incomplete gamma already in ST.
  const pNorm2 = z => 1 - ST.gammp(.5, z * z / 2);

  // Holm step-down adjustment (controls the family-wise error rate).
  function holm(ps){
    const m = ps.length, idx = ps.map((p, i) => [p, i]).sort((a, b) => a[0] - b[0]), adj = new Array(m); let run = 0;
    idx.forEach(([p, i], k) => { run = Math.max(run, (m - k) * p); adj[i] = Math.min(1, run); });
    return adj;
  }

  // Brown–Forsythe form of Levene's test (deviations from the group median); same as scipy.stats.levene(center='median').
  function levene(gs){
    const dev = gs.map(g => { const m = med(g); return g.map(x => Math.abs(x - m)); });
    const r = ST.anova(dev); return { W: r.F, df1: r.df1, df2: r.df2, p: r.p };
  }

  // Every pair of groups with Welch's t test (no equal-variance assumption), Holm-adjusted.
  function pairwiseWelch(gs){
    const out = [];
    for (let i = 0; i < gs.length; i++) for (let j = i + 1; j < gs.length; j++){
      const w = ST.welch(gs[i], gs[j]); out.push({ i, j, diff: ST.mean(gs[i]) - ST.mean(gs[j]), stat: w.t, df: w.df, p: w.p, d: w.d });
    }
    const a = holm(out.map(o => o.p)); out.forEach((o, k) => o.padj = a[k]); return out;
  }

  // Dunn's test after Kruskal–Wallis: mean-rank differences with the tie correction, Holm-adjusted.
  function dunn(gs){
    const all = gs.flat(), N = all.length, { r, ties } = ST.rank(all); let T = 0; for (const t of ties) T += t ** 3 - t;
    const mr = [], ns = []; let o = 0; for (const g of gs){ let s = 0; for (let i = 0; i < g.length; i++) s += r[o + i]; o += g.length; mr.push(s / g.length); ns.push(g.length); }
    const v = N * (N + 1) / 12 - T / (12 * (N - 1)), out = [];
    for (let i = 0; i < gs.length; i++) for (let j = i + 1; j < gs.length; j++){
      const z = (mr[i] - mr[j]) / Math.sqrt(v * (1 / ns[i] + 1 / ns[j])); out.push({ i, j, diff: mr[i] - mr[j], stat: z, p: pNorm2(z) });
    }
    const a = holm(out.map(o => o.p)); out.forEach((o, k) => o.padj = a[k]); return out;
  }

  /* ---------- module UI ---------- */
  let selG = '', selO = '', out = '';
  const MAXG = 12;
  const cats = () => byType('categorical');
  const outs = () => S.cols.filter(c => c.num && ['numeric', 'scale', 'nps'].includes(c.type));
  const opts = (cols, cur) => cols.map(c => `<option value="${S.cols.indexOf(c)}"${String(S.cols.indexOf(c)) === cur ? ' selected' : ''}>${esc(c.name)}</option>`).join('');

  function run(){
    const g = S.cols[+selG], o = S.cols[+selO];
    if (!g || !o) return '<p class="muted">اختر متغير التجميع والمتغير المقاس.</p>';
    const gp = groups(g, o, 2);
    if (gp.length < 3) return '<p class="muted">المقارنات البعدية تحتاج ثلاث مجموعات على الأقل، في كل منها مشاهدتان. للمجموعتين استعمل اختبار «العلاقات».</p>';
    if (gp.length > MAXG) return `<p class="muted">عدد المجموعات ${gp.length} أكبر من ${MAXG}. ادمج الفئات الصغيرة أولاً حتى لا تتضخم المقارنات.</p>`;
    const names = gp.map(x => x[0]), arr = gp.map(x => x[1]), ord = o.type !== 'numeric';
    if (arr.some(a => ST.vari(a) === 0) && !ord) return '<p class="muted">إحدى المجموعات بلا تباين، فلا يصلح اختبار ت لويلش.</p>';
    const lv = levene(arr), res = ord ? dunn(arr) : pairwiseWelch(arr), small = arr.some(a => a.length < 5);
    const desc = `<div class="scroll"><table><thead><tr><th>المجموعة</th><th class="n">n</th><th class="n">${ord ? 'متوسط الرتب' : 'المتوسط'}</th><th class="n">الوسيط</th><th class="n">الانحراف</th></tr></thead><tbody>${arr.map((a, i) => {
      let mr = ''; if (ord){ const all = arr.flat(), rk = ST.rank(all).r; let off = 0; for (let k = 0; k < i; k++) off += arr[k].length; let s = 0; for (let k = 0; k < a.length; k++) s += rk[off + k]; mr = s / a.length; }
      return `<tr><td>${esc(names[i])}</td><td class="n">${a.length}</td><td class="n">${f(ord ? mr : ST.mean(a))}</td><td class="n">${f(med(a))}</td><td class="n">${f(ST.sd(a))}</td></tr>`; }).join('')}</tbody></table></div>`;
    const rows = res.map(r => `<tr><td>${esc(names[r.i])} ← ${esc(names[r.j])}</td><td class="n">${f(r.diff)}</td><td class="n">${f(r.stat)}</td><td class="n">${pf(r.p)}</td><td class="n">${pf(r.padj)}</td>${ord ? '' : `<td class="n">${f(r.d)}</td>`}<td>${r.padj < .05 ? '<span class="pill ok">دال</span>' : '<span class="pill">غير دال</span>'}</td></tr>`).join('');
    const nsig = res.filter(r => r.padj < .05).length;
    return `<p><b>${ord ? 'اختبار دن (Dunn) بعد كروسكال–واليس' : 'مقارنات ثنائية بـ t لويلش'}</b> · ${res.length} مقارنة، بتصحيح هولم</p>
      <p class="small"><span class="stat">اختبار ليفين (براون–فورسايث): W(${lv.df1}, ${lv.df2}) = ${f(lv.W)}, ${pstr(lv.p)}</span> — ${lv.p < .05 ? 'التباينات غير متجانسة بين المجموعات' + (ord ? '، وقد يعني ذلك اختلاف شكل التوزيعات فيتأثر تفسير دن' : '، وهذا سبب استعمال t لويلش لأنه لا يفترض تساوي التباين') : 'لا دليل على اختلاف التباين بين المجموعات'}.</p>
      ${desc}
      <div class="scroll"><table><thead><tr><th>المقارنة</th><th class="n">${ord ? 'فرق متوسط الرتب' : 'فرق المتوسطين'}</th><th class="n">${ord ? 'z' : 't'}</th><th class="n">p</th><th class="n">p بعد هولم</th>${ord ? '' : '<th class="n">d</th>'}<th>الحكم</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p>${nsig ? `بقيت <b class="num">${nsig}</b> من ${res.length} مقارنة دالة عند 5% بعد التصحيح.` : `لم تبقَ أي مقارنة دالة عند 5% بعد التصحيح.`}</p>
      ${small ? '<p class="small"><span class="pill warn">تنبيه</span> إحدى المجموعات أقل من 5 مشاهدات، فالنتائج غير موثوقة عند هذا الحجم.</p>' : ''}
      <p class="small muted">هذه مقارنات استكشافية بعد اختبار شامل. هولم يضبط الخطأ من النوع الأول داخل هذه العائلة من المقارنات فقط، لا عبر كل التحليلات في التطبيق.</p>`;
  }

  addModule({
    id: 'posthoc', label: 'المقارنات البعدية', after: 'rel',
    onAnalyze(){ out = ''; if (!S.cols[+selG] || S.cols[+selG].type !== 'categorical') selG = ''; if (!S.cols[+selO] || !S.cols[+selO].num) selO = ''; },
    render(){
      const gc = cats(), oc = outs();
      if (!gc.length || !oc.length) return '<div class="sheet"><h2>المقارنات البعدية</h2><p class="muted">نحتاج عموداً فئوياً وعموداً رقمياً أو مقياساً على الأقل.</p></div>';
      if (!gc.some(c => String(S.cols.indexOf(c)) === selG)) selG = String(S.cols.indexOf(gc[0]));
      if (!oc.some(c => String(S.cols.indexOf(c)) === selO)) selO = String(S.cols.indexOf(oc[0]));
      return `<div class="sheet"><h2>أي المجموعات تختلف عن غيرها؟</h2>
        <p class="muted small">عندما يكون للمتغير الفئوي ثلاث مجموعات أو أكثر، يخبرك الاختبار الشامل بوجود فرق فقط. هنا نقارن كل زوج على حدة مع تصحيح هولم: t لويلش للمتغير الرقمي، ودن للمقياس الترتيبي، مع اختبار ليفين لتجانس التباين.</p>
        <div class="row"><select id="posthoc-g" aria-label="متغير التجميع">${opts(gc, selG)}</select><span>→</span><select id="posthoc-o" aria-label="المتغير المقاس">${opts(oc, selO)}</select><button id="posthoc-run" class="btn">قارن</button></div>
        <div id="posthoc-out">${out}</div></div>`;
    },
    report(){ return out ? `<section><h2>المقارنات البعدية</h2>${out}</section>` : ''; },
    click(t){ if (t.id !== 'posthoc-run') return false; out = run(); const el = document.getElementById('posthoc-out'); if (el) el.innerHTML = out; const rp = document.getElementById('p-rep'); if (rp) rp.dataset.stale = '1'; return true; },
    change(t){ if (t.id === 'posthoc-g'){ selG = t.value; out = ''; const el = document.getElementById('posthoc-out'); if (el) el.innerHTML = ''; return true; }
      if (t.id === 'posthoc-o'){ selO = t.value; out = ''; const el = document.getElementById('posthoc-out'); if (el) el.innerHTML = ''; return true; } return false; },
  });
  if (typeof module !== 'undefined' && module.exports) module.exports = { holm, levene, pairwiseWelch, dunn, pNorm2 };
})();

sampleData();
